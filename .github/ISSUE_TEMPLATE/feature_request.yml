name: Feature request
description: Propose a narrowly scoped improvement
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: use-case
    attributes:
      label: Use case
      description: What maintainer problem would this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
    validations:
      required: true
  - type: textarea
    id: authority
    attributes:
      label: Security impact
      description: Does this add data access, external calls, or repository write authority?
    validations:
      required: true
